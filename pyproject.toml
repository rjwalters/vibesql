[build-system]
requires = ["maturin>=1.15.0,<2.0"]
build-backend = "maturin"

[project]
name = "vibesql"
version = "0.2.0"
description = "VibeSQL: AI-powered SQL:1999 database in Rust with Python bindings"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]

[tool.maturin]
bindings = "pyo3"
module-name = "vibesql"
manifest-path = "crates/vibesql-python-bindings/Cargo.toml"

[tool.pytest.ini_options]
# The helper-script test suite (scripts/test_*.py). These are unittest-style and
# insert their own sys.path entry, so they need no extra path config.
testpaths = ["scripts"]
# scripts/test_results_config.py matches the default `test_*.py` glob but is a
# shared CONFIG MODULE imported by process_test_results.py and friends — not a
# test file. Collecting it is pure noise, so it is excluded explicitly.
addopts = "--ignore=scripts/test_results_config.py"
