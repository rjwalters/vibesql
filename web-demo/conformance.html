<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="conformance-title">Conformance Report - VibeSQL</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Prevent flash of unstyled content by applying theme before page renders -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme ?? (prefersDark ? 'dark' : 'light');
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body class="bg-white dark:bg-gray-800">
  <div id="app" class="min-h-screen bg-white dark:bg-gray-800">
    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 shadow-md border-b border-gray-300 dark:border-gray-600">
      <div class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex items-center justify-between flex-wrap gap-4">
          <div>
            <h1 class="text-4xl font-bold text-primary-light dark:text-primary-dark" data-i18n="conformance-heading">
              Conformance Report
            </h1>
            <p class="text-base text-gray-500 dark:text-gray-400 mt-2" data-i18n="conformance-subtitle">
              SQL:1999 Standards Compliance Testing
            </p>
          </div>
          <div id="nav-container"></div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main id="conformance-content" class="max-w-7xl mx-auto px-4 py-8">
      <div class="text-center py-12">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
        <p class="mt-4 text-gray-600 dark:text-gray-400" data-i18n="loading-conformance-report">Loading conformance report...</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="mt-12 text-center text-sm text-gray-500 dark:text-gray-400 pb-6 space-y-1">
      <p data-i18n="footer-tagline">VibeSQL - SQL:1999 Database in WebAssembly</p>
      <p id="build-timestamp" class="text-xs text-gray-400 dark:text-gray-500"></p>
    </footer>
  </div>
  <script type="module" src="/src/conformance.ts"></script>
</body>
</html>
