<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conformance Report - VibeSQL</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
  <div id="app" class="min-h-screen bg-surface-light dark:bg-surface-dark">
    <!-- Header -->
    <header class="bg-background shadow-md border-b border-border">
      <div class="max-w-7xl mx-auto px-4 py-6">
        <div class="flex items-center justify-between flex-wrap gap-4">
          <div>
            <h1 class="text-4xl font-bold text-primary-light dark:text-primary-dark">
              Conformance Report
            </h1>
            <p class="text-base text-muted mt-2">
              SQL:1999 Standards Compliance Testing
            </p>
          </div>
          <div id="nav-container"></div>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main id="conformance-content" class="max-w-7xl mx-auto px-4 py-8">
      <div class="text-center py-12">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
        <p class="mt-4 text-gray-600 dark:text-gray-400">Loading conformance report...</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="mt-12 text-center text-sm text-muted pb-6">
      <p>VibeSQL - SQL:1999 Database in WebAssembly</p>
    </footer>
  </div>
  <script type="module" src="/src/conformance.ts"></script>
