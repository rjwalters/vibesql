name: MIRI Undefined Behavior Detection

on:
  push:
    branches: [ main ]
    paths:
      - 'crates/vibesql-storage/src/row.rs'
      - 'crates/vibesql-executor/src/**'
      - '.github/workflows/miri.yml'
  pull_request:
    paths:
      - 'crates/vibesql-storage/src/row.rs'
      - 'crates/vibesql-executor/src/**'
      - '.github/workflows/miri.yml'

jobs:
  miri:
    name: MIRI UB Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Rust nightly with MIRI
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: miri-${{ hashFiles('Cargo.lock') }}

      - name: Setup MIRI
        run: cargo miri setup

      - name: Run MIRI on Row tests
        run: |
          cargo miri test --package vibesql-storage --lib row::tests \
            || (echo "::error::MIRI detected undefined behavior in Row tests" && exit 1)

      - name: Run MIRI on executor tests (sample)
        run: |
          # Run a limited set of executor tests due to MIRI's slowness
          # Note: This blocks PRs on UB detection - intentionally strict
          # We run arena and join reorder tests which are pure algorithm tests without file I/O
          # Exclude tests that require filesystem access (incompatible with MIRI isolation)
          cargo miri test --package vibesql-executor --lib \
            -- \
            arena::tests \
            --test-threads=1 \
            || (echo "::error::MIRI detected undefined behavior in arena tests" && exit 1)
          cargo miri test --package vibesql-executor --lib \
            -- \
            select::join::reorder::tests \
            --test-threads=1 \
            || (echo "::error::MIRI detected undefined behavior in join reorder tests" && exit 1)

      - name: MIRI validation summary
        if: success()
        run: |
          echo "✅ MIRI validation passed - no undefined behavior detected"
          echo "Validated: row::tests, arena::tests, select::join::reorder::tests"
