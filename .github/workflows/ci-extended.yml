name: CI Extended Validation

# Manual-only workflow for extended validation tests
# These tests are informational and run on-demand before merging significant PRs
# Extracted from CI to reduce automatic PR check time (~90 min savings per PR)

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Run all validation suites'
        type: boolean
        default: true
      tpcds:
        description: 'Run TPC-DS validation'
        type: boolean
        default: true
      sqllogictest:
        description: 'Run SQLLogicTest sample'
        type: boolean
        default: true
      pgsql:
        description: 'Run PostgreSQL regression tests'
        type: boolean
        default: true
      tcl:
        description: 'Run SQLite TCL tests'
        type: boolean
        default: true
      python_scripts:
        description: 'Run scripts/ Python test suite (builds Python bindings)'
        type: boolean
        default: true

permissions:
  contents: read

# Prevent duplicate runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # TPC-DS Validation (correctness check against DuckDB)
  # Validates query results match DuckDB - catches SQL correctness regressions
  # ============================================================================
  tpcds-validation:
    if: ${{ github.event.inputs.run_all == 'true' || github.event.inputs.tpcds == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci-extended

      - name: Run TPC-DS benchmark runner with validation
        env:
          SCALE_FACTOR: "0.001"
          SKIP_SLOW: "1"
          VALIDATE: "1"
        run: |
          # Build and run the TPC-DS runner with validation
          cargo bench --bench tpcds_runner --features sqlite,in-memory-indexes -- 2>&1 | tee tpcds_output.txt

          # Check for validation failures
          if grep -q "VALIDATION FAILED" tpcds_output.txt; then
            echo "::error::TPC-DS validation failed - some queries returned incorrect results"
            exit 1
          fi

          # Check for pass status
          if grep -q "VALIDATION PASSED" tpcds_output.txt; then
            echo "TPC-DS validation passed!"
          fi

      - name: Display TPC-DS results
        if: always()
        run: |
          echo "## TPC-DS Benchmark Results (SF 0.001)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All 99 TPC-DS queries validated against DuckDB (skip slow: Q4, Q11, Q17, Q24, Q29)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Extract CSV output from the runner
          if [ -f tpcds_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A 1000 "=== CSV Output ===" tpcds_output.txt | head -110 >> $GITHUB_STEP_SUMMARY || echo "No CSV output found"
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # SQLLogicTest Sample (fast feedback on SQL correctness)
  # Runs a representative sample of the 7.4M test suite for quick validation
  # ============================================================================
  sqllogictest:
    if: ${{ github.event.inputs.run_all == 'true' || github.event.inputs.sqllogictest == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci-extended

      - name: Run SQLLogicTest sample
        env:
          # Run a representative sample of tests for fast feedback
          # These cover core SQL functionality without running the full 7.4M test suite
          SQLLOGICTEST_FILES: "select1.test,select2.test,select3.test,index/commute/10/slt_good_0.test"
          SQLLOGICTEST_TIME_BUDGET: "600"
        run: |
          cargo test --release --package vibesql --test sqllogictest_suite -- --nocapture 2>&1 | tee sqllogictest_output.txt

      - name: Display SQLLogicTest results
        if: always()
        run: |
          echo "## SQLLogicTest Results (Sample)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Running representative sample of SQL correctness tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f sqllogictest_output.txt ]; then
            # Extract pass/fail summary
            if grep -q "test result: ok" sqllogictest_output.txt; then
              echo "Status: PASSED" >> $GITHUB_STEP_SUMMARY
            else
              echo "Status: Some tests failed (see logs)" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  # ============================================================================
  # PostgreSQL Regression Tests (trigger and DDL conformance)
  # Tests PostgreSQL-style trigger syntax and DDL operations
  # ============================================================================
  pgsql-regress:
    if: ${{ github.event.inputs.run_all == 'true' || github.event.inputs.pgsql == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci-extended

      - name: Run PostgreSQL Regression Tests
        run: |
          cargo test -p vibesql --test pgsql_regress --release -- --nocapture 2>&1 | tee pgsql_regress_output.txt

      - name: Display PostgreSQL Regression results
        if: always()
        run: |
          echo "## PostgreSQL Regression Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Testing PostgreSQL-compatible trigger syntax and DDL operations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f pgsql_regress_output.txt ]; then
            # Extract summary line
            SUMMARY=$(grep -E "^Total:" pgsql_regress_output.txt || echo "")
            if [ -n "$SUMMARY" ]; then
              echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
            fi
            # Extract pass rate
            PASS_RATE=$(grep -E "^Pass rate:" pgsql_regress_output.txt || echo "")
            if [ -n "$PASS_RATE" ]; then
              echo "$PASS_RATE" >> $GITHUB_STEP_SUMMARY
            fi
            # Check final status
            if grep -q "test result: ok" pgsql_regress_output.txt; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Status: PASSED" >> $GITHUB_STEP_SUMMARY
            else
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "Status: FAILED (see logs)" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  # ============================================================================
  # SQLite TCL Test Suite (SQLite compatibility conformance)
  # Runs Priority 1 core SQL tests to detect regressions
  # ============================================================================
  tcl-tests:
    if: ${{ github.event.inputs.run_all == 'true' || github.event.inputs.tcl == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci-extended

      - name: Build VibeSQL
        run: cargo build --release

      - name: Run TCL tests (Priority 1 sample)
        run: |
          ./scripts/tcltest run --priority 1 --limit 10 2>&1 | tee tcl_output.txt

      - name: Check for regression
        run: |
          python3 scripts/check_tcl_regression.py tcl_output.txt

      - name: Display TCL test results
        if: always()
        run: |
          echo "## SQLite TCL Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Testing SQLite compatibility via canonical TCL test suite" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tcl_output.txt ]; then
            # Extract summary
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "^(Total tests|Passed|Failed|Skipped):" tcl_output.txt >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            # Check baseline comparison
            if grep -q "REGRESSION DETECTED" tcl_output.txt 2>/dev/null; then
              echo "Status: REGRESSION DETECTED" >> $GITHUB_STEP_SUMMARY
            elif grep -q "IMPROVEMENT" tcl_output.txt 2>/dev/null; then
              echo "Status: IMPROVED" >> $GITHUB_STEP_SUMMARY
            else
              echo "Status: PASS (no regression)" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  # ============================================================================
  # Python scripts test suite (scripts/test_*.py against the repo's own build)
  # Builds the Python bindings wheel from this checkout, installs it, and runs
  # pytest with VIBESQL_REQUIRE_BINDINGS=1 so the bindings tests must PASS —
  # a skip (missing bindings) or a stale-wheel version mismatch fails the job.
  # See issue #6323 and scripts/conftest.py.
  # ============================================================================
  python-scripts:
    if: ${{ github.event.inputs.run_all == 'true' || github.event.inputs.python_scripts == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci-extended

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and install Python bindings from this checkout
        run: |
          python3 -m pip install --upgrade pip maturin pytest
          maturin build --release -m crates/vibesql-python-bindings/Cargo.toml
          python3 -m pip install --force-reinstall "$(ls -t target/wheels/vibesql-*.whl | head -1)"

      - name: Run scripts/ test suite (bindings required, skips forbidden)
        env:
          VIBESQL_REQUIRE_BINDINGS: "1"
        run: |
          python3 -m pytest -v -rs 2>&1 | tee pytest_scripts_output.txt

      - name: Display Python scripts test results
        if: always()
        run: |
          echo "## Python Scripts Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "scripts/test_*.py run against the bindings built from this checkout" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f pytest_scripts_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 pytest_scripts_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Summary job - reports overall status
  # ============================================================================
  summary:
    runs-on: ubuntu-latest
    needs: [tpcds-validation, sqllogictest, pgsql-regress, tcl-tests, python-scripts]
    if: always()
    steps:
      - name: Report summary
        run: |
          echo "## CI Extended Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TPC-DS Validation | ${{ needs.tpcds-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SQLLogicTest | ${{ needs.sqllogictest.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PostgreSQL Regression | ${{ needs.pgsql-regress.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SQLite TCL Tests | ${{ needs.tcl-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Scripts | ${{ needs.python-scripts.result }} |" >> $GITHUB_STEP_SUMMARY
