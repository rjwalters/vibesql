name: Release to crates.io

# Publishes with crates.io trusted publishing (OIDC): no token is stored. Each
# crate's crates.io settings trust repository 2AMLogic/vibesql, workflow
# release-crates.yml, environment `crates`; the `crates` environment requires
# the owner's approval.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build but do not publish)'
        required: false
        default: 'true'
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""  # Disable sccache (not installed on runners)
  # Dependency order: each crate is published after the crates it uses.
  CRATES: >-
    vibesql-types vibesql-l10n vibesql-ast vibesql-parser vibesql-catalog
    vibesql-storage vibesql-bench-common vibesql-executor vibesql-consensus
    vibesql-cli vibesql

jobs:
  dry-run:
    name: Dry run (no publish)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Disable sccache
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}

      # Multi-package dry run: cargo resolves the workspace crates against each
      # other, so it works before any of the new versions are on crates.io.
      # Versions that already exist only produce a warning.
      - name: Dry run check
        run: |
          set -euo pipefail
          echo "Dry run mode - will verify packages but not publish"
          args=()
          for crate in $CRATES; do args+=(-p "$crate"); done
          cargo publish --dry-run "${args[@]}"

  publish:
    name: Publish to crates.io
    # A manual run with dry_run ticked uses the `dry-run` job instead.
    if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    # Protected environment: the owner approves every run before it starts.
    environment: crates
    permissions:
      contents: read
      id-token: write # OIDC token for crates.io trusted publishing
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Disable sccache
        run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-publish-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify versions match tag
        if: github.event_name == 'push'
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v$TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi
          echo "Version $VERSION matches tag"

      # Idempotent re-runs: publish only the crates whose version is not on
      # crates.io yet, so a run that failed partway resumes where it stopped.
      # 404 means "not published"; any other status fails the job rather than
      # guessing.
      - name: Which crates still need publishing?
        id: check
        run: |
          set -euo pipefail
          version=$(grep '^version = ' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          pending=""
          for crate in $CRATES; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors \
              -A 'vibesql-release (github.com/2AMLogic/vibesql)' \
              "https://crates.io/api/v1/crates/${crate}/${version}")"
            case "$code" in
              200) echo "::notice::${crate} ${version} is already on crates.io" ;;
              404) pending="${pending} ${crate}" ;;
              *) echo "::error::crates.io returned HTTP ${code} for ${crate} ${version}"; exit 1 ;;
            esac
          done
          echo "pending=${pending# }" >> "$GITHUB_OUTPUT"

      - name: Authenticate to crates.io
        if: steps.check.outputs.pending != ''
        id: auth
        # rust-lang/crates-io-auth-action v1.0.5, pinned: it exchanges the
        # GitHub OIDC token for a short-lived crates.io token and revokes it
        # when the job ends.
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18

      # Each `cargo publish` waits for its crate to reach the index before
      # returning, so no sleeps are needed between dependent crates.
      - name: cargo publish
        if: steps.check.outputs.pending != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          PENDING: ${{ steps.check.outputs.pending }}
        run: |
          set -euo pipefail
          for crate in $PENDING; do
            cargo publish -p "$crate"
          done

      - name: Summary
        env:
          PENDING: ${{ steps.check.outputs.pending }}
        run: |
          {
            echo "## crates.io Release Summary"
            echo ""
            if [ -z "$PENDING" ]; then
              echo "Every crate was already on crates.io: nothing to publish."
            else
              echo "Published packages:"
              for crate in $PENDING; do echo "- $crate"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"
