name: CI and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Simpler concurrency: just prevent multiple CI runs on main
concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # JOB 1: Build and Test
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          # Remove large pre-installed software to free disk space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Run unit tests
        run: cargo test --release -- --skip run_sqllogictest_suite

      - name: Run sqltest conformance suite
        run: cargo test -p vibesql --test sqltest_conformance --release -- --nocapture
        continue-on-error: true

  # ============================================================================
  # JOB 2: Deploy Web Demo
  # Benchmark data is committed directly to web-demo/public/benchmarks/
  # and gets deployed with the web demo build.
  # ============================================================================
  deploy:
    needs: [test]
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      rebuild-web-demo: true
