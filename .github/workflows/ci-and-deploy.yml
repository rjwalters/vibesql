name: CI and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Simpler concurrency: just prevent multiple CI runs on main
concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # JOB 1: Build and Test
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          # Remove large pre-installed software to free disk space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Run unit tests
        run: cargo test --release -- --skip run_sqllogictest_suite

      - name: Run sqltest conformance suite
        run: cargo test -p vibesql --test sqltest_conformance --release -- --nocapture
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v5
        with:
          name: ci-test-results
          path: |
            target/sqltest_results.json
          retention-days: 90

  # ============================================================================
  # JOB 2: TPC-H Benchmarks
  # ============================================================================
  tpch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    continue-on-error: true
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: tpch
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MYSQL_URL: mysql://root:password@127.0.0.1:3306/tpch
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run TPC-H benchmarks (quick mode)
        continue-on-error: true
        run: |
          python3 scripts/run_tpch_benchmarks.py --quick --output tpch_results.json

      - name: Upload TPC-H results
        if: always() && hashFiles('tpch_results.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: ci-tpch-results
          path: tpch_results.json
          retention-days: 90

      - name: Display results summary
        if: always()
        run: |
          echo "## TPC-H Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Real-world decision support queries (TPC-H SF 0.01)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tpch_results.json ]; then
            echo "TPC-H benchmarks completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "No results file generated" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # JOB 3: TPC-C Benchmarks (OLTP workload)
  # ============================================================================
  tpcc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    continue-on-error: true
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Run TPC-C benchmark
        env:
          TPCC_SCALE_FACTOR: "1"
          TPCC_DURATION_SECS: "10"
          TPCC_WARMUP_SECS: "2"
        run: |
          cargo bench --package vibesql-executor --bench tpcc_benchmark -- 2>&1 | tee tpcc_output.txt

      - name: Display TPC-C results
        if: always()
        run: |
          echo "## TPC-C Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "OLTP transactional workload (Scale Factor 1, 10s duration)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tpcc_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Extract summary section
            grep -A 20 "TPC-C Results" tpcc_output.txt >> $GITHUB_STEP_SUMMARY || tail -30 tpcc_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # JOB 4: Sysbench Benchmarks
  # ============================================================================
  sysbench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    continue-on-error: true
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run Sysbench benchmarks (quick mode)
        continue-on-error: true
        run: |
          python3 scripts/run_sysbench_benchmarks.py --quick --output sysbench_results.json

      - name: Upload Sysbench results
        if: always() && hashFiles('sysbench_results.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: ci-sysbench-results
          path: sysbench_results.json
          retention-days: 90

      - name: Display Sysbench results
        if: always()
        run: |
          echo "## Sysbench Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f sysbench_results.json ]; then
            python3 << 'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          with open('sysbench_results.json') as f:
              data = json.load(f)
          print('| Workload | Database | Latency |')
          print('|----------|----------|---------|')
          for b in data.get('benchmarks', []):
              name_parts = b['name'].split('_')
              db = name_parts[-1]
              workload = '_'.join(name_parts[1:-1])
              latency_us = b['stats']['mean'] * 1_000_000
              print(f'| {workload} | {db} | {latency_us:.2f} us |')
          PYEOF
          else
            echo "No results file generated" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # JOB 5: TPC-DS Benchmark with Validation
  # ============================================================================
  tpcds:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    continue-on-error: true
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Run TPC-DS benchmark runner with validation
        env:
          SCALE_FACTOR: "0.001"
          SKIP_SLOW: "1"
          VALIDATE: "1"
        run: |
          # Build and run the TPC-DS runner with validation
          cargo bench --bench tpcds_runner --features benchmark-comparison -- 2>&1 | tee tpcds_output.txt

          # Check for validation failures
          if grep -q "VALIDATION FAILED" tpcds_output.txt; then
            echo "::error::TPC-DS validation failed - some queries returned incorrect results"
            exit 1
          fi

          # Check for pass status
          if grep -q "VALIDATION PASSED" tpcds_output.txt; then
            echo "TPC-DS validation passed!"
          fi

      - name: Display TPC-DS results
        if: always()
        run: |
          echo "## TPC-DS Benchmark Results (SF 0.001)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All 99 TPC-DS queries validated against DuckDB (skip slow: Q4, Q11, Q17, Q24, Q29)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Extract CSV output from the runner
          if [ -f tpcds_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A 1000 "=== CSV Output ===" tpcds_output.txt | head -110 >> $GITHUB_STEP_SUMMARY || echo "No CSV output found"
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # JOB 6: SQLLogicTest Suite
  # ============================================================================
  sqllogictest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    continue-on-error: true
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Run SQLLogicTest suite
        env:
          # Run comprehensive test suite for main branch
          SQLLOGICTEST_TIME_BUDGET: "2400"
        run: |
          cargo test --release --package vibesql --test sqllogictest_suite -- --nocapture 2>&1 | tee sqllogictest_output.txt

      - name: Upload SQLLogicTest results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-sqllogictest-results
          path: |
            target/sqllogictest_results.json
          retention-days: 90

      - name: Display SQLLogicTest results
        if: always()
        run: |
          echo "## SQLLogicTest Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SQL conformance test suite (40-minute time budget)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f sqllogictest_output.txt ]; then
            if grep -q "test result: ok" sqllogictest_output.txt; then
              echo "Status: PASSED" >> $GITHUB_STEP_SUMMARY
            else
              echo "Status: Some tests failed (see logs)" >> $GITHUB_STEP_SUMMARY
            fi
            # Show summary statistics if available
            if [ -f target/sqllogictest_results.json ]; then
              python3 << 'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          try:
              with open('target/sqllogictest_results.json') as f:
                  data = json.load(f)
              print(f"Files tested: {data.get('total', 'N/A')}")
              print(f"Pass rate: {data.get('pass_rate', 'N/A')}%")
          except:
              pass
          PYEOF
            fi
          fi

  # ============================================================================
  # JOB 7: Footprint Benchmark (binary/WASM sizes, startup time, memory)
  # ============================================================================
  footprint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    continue-on-error: true
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust for native + WASM
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key-suffix: footprint

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build release binary
        run: cargo build --release --package vibesql-cli

      - name: Build WASM bindings
        run: |
          mkdir -p web-demo/public/pkg
          wasm-pack build --target web --out-dir ${{ github.workspace }}/web-demo/public/pkg crates/vibesql-wasm-bindings --release

      - name: Install DuckDB CLI
        run: |
          wget -q https://github.com/duckdb/duckdb/releases/download/v1.1.3/duckdb_cli-linux-amd64.zip
          unzip -q duckdb_cli-linux-amd64.zip
          sudo mv duckdb /usr/local/bin/
          duckdb --version

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run footprint benchmark
        run: |
          python3 scripts/benchmark_footprint.py --output footprint_results.json --runs 5
          cat footprint_results.json

      - name: Upload footprint results
        if: always() && hashFiles('footprint_results.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: ci-footprint-results
          path: footprint_results.json
          retention-days: 90

      - name: Display footprint results
        if: always()
        run: |
          echo "## Footprint Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Binary sizes, startup time, and memory usage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f footprint_results.json ]; then
            python3 << 'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          with open('footprint_results.json') as f:
              data = json.load(f)
          print('| Database | Binary Size | Startup Time | Peak Memory |')
          print('|----------|-------------|--------------|-------------|')
          for b in data.get('benchmarks', []):
              db = b['database']
              size_mb = b['binary_size_bytes'] / (1024*1024)
              startup_ms = b['startup_time_ms']
              memory_mb = b['peak_memory_kb'] / 1024
              if b['available']:
                  print(f'| {db} | {size_mb:.2f} MB | {startup_ms:.2f} ms | {memory_mb:.1f} MB |')
              else:
                  print(f'| {db} | N/A | N/A | N/A |')
          # Show WASM size if available
          vibesql = next((b for b in data.get('benchmarks', []) if b['database'] == 'vibesql'), None)
          if vibesql and vibesql.get('wasm_size_bytes'):
              wasm_mb = vibesql['wasm_size_bytes'] / (1024*1024)
              wasm_gzip_mb = vibesql.get('wasm_size_gzip_bytes', 0) / (1024*1024) if vibesql.get('wasm_size_gzip_bytes') else 0
              print('')
              print(f'**WASM Size:** {wasm_mb:.2f} MB (gzip: {wasm_gzip_mb:.2f} MB)')
          PYEOF
          else
            echo "No footprint results generated" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # JOB 8: Python Benchmarks
  # ============================================================================
  python-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    continue-on-error: true
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build and install Python bindings
        run: |
          uv pip install --system maturin
          cd crates/vibesql-python-bindings
          maturin build --release
          uv pip install --system ../../target/wheels/vibesql-*.whl

      - name: Install benchmark dependencies
        run: |
          grep -v "^vibesql" benchmarks/requirements.txt > /tmp/requirements-ci.txt
          uv pip install --system -r /tmp/requirements-ci.txt

      - name: Run benchmarks
        working-directory: benchmarks
        run: |
          pytest test_insert.py test_update.py test_delete.py test_select.py test_aggregates.py \
            --benchmark-only \
            --benchmark-json=../benchmark_results.json \
            --benchmark-min-rounds=3 \
            --benchmark-warmup=off

      - name: Upload benchmark results
        if: always() && hashFiles('benchmark_results.json') != ''
        uses: actions/upload-artifact@v5
        with:
          name: ci-benchmark-results
          path: benchmark_results.json
          retention-days: 90

      - name: Display benchmark summary
        if: always()
        run: |
          echo "## Python Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f benchmark_results.json ]; then
            python benchmarks/format_results.py benchmark_results.json >> $GITHUB_STEP_SUMMARY
          else
            echo "No benchmark results generated" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # JOB 8: Deploy (calls centralized workflow)
  # NOTE: Only depends on test, not benchmarks. Deploy workflow will use:
  #   - New benchmark data if benchmark jobs finish in time
  #   - Historical benchmark data from Pages site otherwise
  # This prevents slow benchmarks from blocking deployment.
  # ============================================================================
  deploy:
    needs: [test]
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      artifact-name: ci-test-results
      benchmark-artifact-name: ci-benchmark-results
      rebuild-web-demo: true
