name: Deploy to GitHub Pages

on:
  workflow_call:
    inputs:
      rebuild-web-demo:
        description: 'Whether to rebuild the web demo from scratch'
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        type: string
        required: false
        default: 'Manual deployment'
      rebuild-web-demo:
        description: 'Rebuild web demo'
        type: boolean
        required: false
        default: true

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# CRITICAL: Single concurrency group for ALL Pages deployments
# This prevents race conditions from ci-and-deploy and manual redeploys
concurrency:
  group: pages-deployment
  cancel-in-progress: false  # Queue deployments, don't cancel

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # ============================================================================
      # Build Web Demo
      # Benchmark data is committed in web-demo/public/benchmarks/ and included
      # automatically in the build.
      # ============================================================================
      - name: Setup Rust for WASM
        if: inputs.rebuild-web-demo || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key-suffix: wasm

      - name: Install wasm-pack
        if: inputs.rebuild-web-demo || github.event_name == 'workflow_dispatch'
        run: |
          # Pin wasm-pack version for reproducible builds
          WASM_PACK_VERSION="0.13.1"
          curl -L "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xzf -
          sudo mv wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/
          wasm-pack --version
        shell: bash

      - name: Clean old WASM files
        if: inputs.rebuild-web-demo || github.event_name == 'workflow_dispatch'
        run: rm -rf web-demo/public/pkg
        shell: bash

      - name: Build WASM bindings
        if: inputs.rebuild-web-demo || github.event_name == 'workflow_dispatch'
        run: wasm-pack build --target web --out-dir ${{ github.workspace }}/web-demo/public/pkg crates/vibesql-wasm-bindings --release
        shell: bash

      - name: Setup pnpm
        if: inputs.rebuild-web-demo || github.event_name == 'workflow_dispatch'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        if: inputs.rebuild-web-demo || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web-demo/pnpm-lock.yaml

      - name: Build web demo
        if: inputs.rebuild-web-demo || github.event_name == 'workflow_dispatch'
        working-directory: web-demo
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # ============================================================================
      # Prepare Deployment Directory
      # ============================================================================
      - name: Prepare deployment
        run: |
          mkdir -p deploy

          if [ -d web-demo/dist ]; then
            echo "Using freshly built web demo"
            cp -r web-demo/dist/* deploy/
          else
            echo "ERROR: No web demo build found!"
            exit 1
          fi

          # Show what benchmark files are included
          echo "Benchmark files included:"
          ls -la deploy/benchmarks/ || echo "No benchmarks directory"

      # ============================================================================
      # Deploy to GitHub Pages
      # ============================================================================
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "## 🚀 Deployed to GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://rjwalters.github.io/vibesql/" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Benchmark Data" >> $GITHUB_STEP_SUMMARY
          echo "Benchmark results are committed to \`web-demo/public/benchmarks/\`" >> $GITHUB_STEP_SUMMARY
          echo "and included automatically in the build." >> $GITHUB_STEP_SUMMARY
