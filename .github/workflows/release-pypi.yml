name: Release to PyPI

on:
  # Trigger on version tags
  push:
    tags:
      - 'v*'
  # Allow manual trigger for testing
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build but do not publish)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  id-token: write  # Required for trusted publishing

jobs:
  # Build wheels for multiple platforms
  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Linux aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          # macOS x86_64 (using macos-15 as macos-13 is deprecated)
          - os: macos-15
            target: x86_64-apple-darwin
          # macOS Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Disable sccache wrapper (not installed on runners)
      - name: Disable sccache
        run: echo "RUSTC_WRAPPER=" >> $GITHUB_ENV
        shell: bash

      # Install cross-compilation tools for Linux aarch64
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels
        working-directory: crates/vibesql-python-bindings
        env:
          # For aarch64 Linux cross-compilation
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          maturin build --release --target ${{ matrix.target }} --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: crates/vibesql-python-bindings/dist/*.whl

  # Build source distribution
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Disable sccache wrapper (not installed on runners)
      - name: Disable sccache
        run: echo "RUSTC_WRAPPER=" >> $GITHUB_ENV

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist
        working-directory: crates/vibesql-python-bindings
        run: maturin sdist --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: crates/vibesql-python-bindings/dist/*.tar.gz

  # Publish to PyPI using trusted publishing
  publish:
    name: Publish to PyPI
    needs: [build, sdist]
    runs-on: ubuntu-latest
    # Only publish on tag push (not manual dry runs)
    if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/vibesql

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -la dist/

      - name: Publish to PyPI
        if: github.event_name == 'push' || github.event.inputs.dry_run != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # No password needed - uses trusted publishing via OIDC
