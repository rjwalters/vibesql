name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Prevent duplicate runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Fast CI for branches/PRs - optimized for speed
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Run unit tests
        run: cargo test --release --no-default-features --features parallel,spatial -- --skip run_sqllogictest_suite

      - name: Clean build artifacts to save disk space
        run: |
          cargo clean
          rm -rf target/release/deps
          df -h

      - name: Run integration tests
        run: cargo test --release --no-default-features --features parallel,spatial --test '*' -- --skip run_sqllogictest_suite
        continue-on-error: false

      - name: Final cleanup
        run: |
          cargo clean
          df -h

  # ============================================================================
  # TPC-H Quick Benchmarks
  # Runs in parallel with other benchmarks (no dependency on test job)
  # ============================================================================
  tpch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python with uv
        run: uv python install 3.11

      - name: Run TPC-H benchmarks (quick mode)
        run: |
          uv run --python 3.11 scripts/run_tpch_benchmarks.py --quick --output tpch_results.json

      - name: Display TPC-H results
        if: always()
        run: |
          echo "## TPC-H Benchmark Results (Quick Mode)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tpch_results.json ]; then
            echo "TPC-H Q6 benchmark completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "No results file generated" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Sysbench Quick Benchmarks
  # Runs in parallel with other benchmarks (no dependency on test job)
  # ============================================================================
  sysbench:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python with uv
        run: uv python install 3.11

      - name: Run Sysbench benchmarks (quick mode)
        run: |
          uv run --python 3.11 scripts/run_sysbench_benchmarks.py --quick --output sysbench_results.json

      - name: Display Sysbench results
        if: always()
        run: |
          echo "## Sysbench Results (Quick Mode)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f sysbench_results.json ]; then
            uv run --python 3.11 - << 'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          with open('sysbench_results.json') as f:
              data = json.load(f)
          print('| Workload | Database | Latency |')
          print('|----------|----------|---------|')
          for b in data.get('benchmarks', []):
              name_parts = b['name'].split('_')
              db = name_parts[-1]
              workload = '_'.join(name_parts[1:-1])
              latency_us = b['stats']['mean'] * 1_000_000
              print(f'| {workload} | {db} | {latency_us:.2f} us |')
          PYEOF
          else
            echo "No results file generated" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # TPC-DS Quick Benchmark with Validation
  # Runs in parallel with other benchmarks (no dependency on test job)
  # ============================================================================
  tpcds:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Run TPC-DS benchmark runner with validation
        env:
          SCALE_FACTOR: "0.001"
          SKIP_SLOW: "1"
          VALIDATE: "1"
        run: |
          # Build and run the TPC-DS runner with validation
          cargo bench --bench tpcds_runner --features benchmark-comparison -- 2>&1 | tee tpcds_output.txt

          # Check for validation failures
          if grep -q "VALIDATION FAILED" tpcds_output.txt; then
            echo "::error::TPC-DS validation failed - some queries returned incorrect results"
            exit 1
          fi

          # Check for pass status
          if grep -q "VALIDATION PASSED" tpcds_output.txt; then
            echo "TPC-DS validation passed!"
          fi

      - name: Display TPC-DS results
        if: always()
        run: |
          echo "## TPC-DS Benchmark Results (SF 0.001)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All 99 TPC-DS queries validated against DuckDB (skip slow: Q4, Q11, Q17, Q24, Q29)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Extract CSV output from the runner
          if [ -f tpcds_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A 1000 "=== CSV Output ===" tpcds_output.txt | head -110 >> $GITHUB_STEP_SUMMARY || echo "No CSV output found"
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # SQLLogicTest Sample (fast feedback on SQL correctness)
  # Runs in parallel with other benchmarks (no dependency on test job)
  # ============================================================================
  sqllogictest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Run SQLLogicTest sample
        env:
          # Run a representative sample of tests for fast feedback
          # These cover core SQL functionality without running the full 7.4M test suite
          SQLLOGICTEST_FILES: "select1.test,select2.test,select3.test,index/commute/10/slt_good_0.test"
          SQLLOGICTEST_TIME_BUDGET: "600"
        run: |
          cargo test --release --package vibesql --test sqllogictest_suite -- --nocapture 2>&1 | tee sqllogictest_output.txt

      - name: Display SQLLogicTest results
        if: always()
        run: |
          echo "## SQLLogicTest Results (Sample)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Running representative sample of SQL correctness tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f sqllogictest_output.txt ]; then
            # Extract pass/fail summary
            if grep -q "test result: ok" sqllogictest_output.txt; then
              echo "Status: PASSED" >> $GITHUB_STEP_SUMMARY
            else
              echo "Status: Some tests failed (see logs)" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  # ============================================================================
  # Python Benchmarks (pytest-based micro-benchmarks)
  # Runs in parallel with other benchmarks (no dependency on test job)
  # ============================================================================
  python-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python with uv
        run: uv python install 3.11

      - name: Build and install Python bindings
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install maturin
          cd crates/vibesql-python-bindings
          maturin build --release
          uv pip install ../../target/wheels/vibesql-*.whl

      - name: Install benchmark dependencies
        run: |
          source .venv/bin/activate
          grep -v "^vibesql" benchmarks/requirements.txt > /tmp/requirements-ci.txt
          uv pip install -r /tmp/requirements-ci.txt

      - name: Run quick benchmarks (1k tests only)
        working-directory: benchmarks
        run: |
          source ../.venv/bin/activate
          pytest test_insert.py test_update.py test_delete.py test_select.py test_aggregates.py \
            --benchmark-only \
            --benchmark-json=../benchmark_results.json \
            --benchmark-min-rounds=3 \
            --benchmark-warmup=off

      - name: Display benchmark summary
        if: always()
        run: |
          echo "## Python Benchmark Results (1k tests)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f benchmark_results.json ]; then
            source .venv/bin/activate
            python benchmarks/format_results.py benchmark_results.json >> $GITHUB_STEP_SUMMARY
          else
            echo "No benchmark results generated" >> $GITHUB_STEP_SUMMARY
          fi
