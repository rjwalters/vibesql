name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Prevent duplicate runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Verify benchmark queries haven't been modified
  # ============================================================================
  verify-benchmark-queries:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - name: Verify TPC-H and TPC-DS queries
        run: python3 scripts/verify_benchmark_queries.py

  # ============================================================================
  # Guard against web-demo lockfile drift (manifest-only dependency bumps).
  # pnpm defaults to --frozen-lockfile in CI; this fails fast with
  # ERR_PNPM_OUTDATED_LOCKFILE if package.json and pnpm-lock.yaml disagree.
  # See issue #5251.
  # ============================================================================
  web-demo-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web-demo/package.json

      - name: Verify web-demo lockfile is in sync
        run: pnpm install --frozen-lockfile
        working-directory: web-demo

  # ============================================================================
  # Build, test, and lint the npm packages in packages/* (root pnpm workspace).
  # The root `pnpm install --frozen-lockfile` also guards against root-workspace
  # manifest/lockfile drift — the sibling gap to #5251's web-demo guard.
  # Before this job, breaking npm bumps got green checkmarks. See issue #6386.
  # ============================================================================
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Verify root workspace lockfile is in sync
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Test all packages
        run: pnpm -r test

      - name: Lint all packages
        run: pnpm -r lint

  # ============================================================================
  # Rust formatting check - guards against the stable/nightly rustfmt drift
  # described in issue #6326: rustfmt.toml sets several nightly-only options
  # (wrap_comments, imports_granularity, group_imports,
  # format_code_in_doc_comments) that a stable-only rustfmt silently ignores,
  # producing different (more aggressive single-line-collapsing) output than
  # the committed style. `make fmt-check` pins the exact nightly toolchain
  # (FMT_TOOLCHAIN in the Makefile) and installs it via rustup if missing, so
  # this check is deterministic regardless of what's preinstalled on the
  # runner. Deliberately just a checkout + `make fmt-check` (no
  # setup-rust/sccache/full toolchain) to keep this job fast.
  # ============================================================================
  fmt-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check Rust formatting
        run: make fmt-check

  # ============================================================================
  # Fast CI for branches/PRs - optimized for speed
  #
  # History (do not let a third occurrence get debugged from scratch):
  #   - #5342 raised this job's timeout-minutes from 25 to 35 after the suite
  #     grew into the previous cap.
  #   - #6479 found the cap being brushed again (~40% timeout-kill rate on
  #     unrelated branches, always killed mid "Run integration tests") and
  #     diagnosed the real cause: this used to be a single `test` job that ran
  #     unit tests, then `cargo clean` + `rm -rf target/release/deps` to save
  #     disk, then integration tests — forcing the integration step to pay for
  #     a *second full release rebuild* under the same clock as the first.
  #     Fixed by splitting into the two independent jobs below (test-unit /
  #     test-integration), each getting its own dedicated timeout budget and
  #     its own from-scratch build, running in parallel instead of serialized
  #     behind one shared 35-minute cap. This also means a timeout-kill (or a
  #     genuine failure) in one phase no longer masks whether the other phase
  #     ever got a fair share of the clock — check `gh run view <run-id>
  #     --json jobs` for the per-job `conclusion` field (`cancelled` = timeout
  #     kill, `failure` = genuine test failure) without opening either job's
  #     step list.
  #   - If this pattern (cap creeping back up against real run times) recurs a
  #     third time, look for the same shape: redundant rebuilds sharing one
  #     clock, not just "raise the cap again".
  # ============================================================================
  test-unit:
    runs-on: ubuntu-latest
    # Provisional estimate for a single from-scratch release build + unit test
    # run (no more back-to-back double build — see history above). Revisit
    # once several real runs establish an actual measured range.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Run unit tests
        run: cargo test --release --no-default-features --features parallel,spatial -- --skip run_sqllogictest_suite

  test-integration:
    runs-on: ubuntu-latest
    # See test-unit above: same provisional budget, independent clock. Runs
    # on its own runner in parallel with test-unit, so no shared disk/clock
    # pressure and no need for the old mid-job `cargo clean` workaround.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Run integration tests
        run: cargo test --release --no-default-features --features parallel,spatial --test '*' -- --skip run_sqllogictest_suite
        continue-on-error: false

  # ============================================================================
  # Root `vibesql` package's own integration tests (#6480).
  #
  # Why this job exists: root Cargo.toml is BOTH the workspace root AND a real
  # package (`[package] name = "vibesql"`), and its `[workspace]` table sets
  # `default-members` EXPLICITLY to the crates/* library/binary crates only —
  # the root `vibesql` package itself is deliberately left out of that list (to
  # keep everyday `cargo build`/`cargo test` fast). Cargo's package-selection
  # rules mean an explicit `default-members` list overrides the usual "select
  # the current directory's own package" default, even though that package IS
  # the workspace root. Consequence: the two bare `cargo test` invocations
  # above (test-unit / test-integration — no `-p`, no `--workspace`) already
  # cover every crates/* member (confirmed: vibesql-cli's `--bin vibesql`
  # executor test suite already runs there), but they silently never compile
  # or run ANY of the ~90 `[[test]]` integration-test targets declared directly
  # in the root Cargo.toml (tests/executor, tests/storage, tests/security,
  # tests/regression, tests/integration, ...) — a much larger gap than the
  # "vibesql-cli tests never run in CI" framing #6480 opened with.
  #
  # We deliberately do NOT switch the invocation to `--workspace`: that would
  # pull in every `[[test]]` target unconditionally, including
  # tests/z_compliance/sqltest_conformance.rs, which fails to compile today
  # with an unrelated pre-existing bug (#6412, a non-exhaustive match over
  # `Statement` missing the ATTACH/DETACH variants) — turning this whole gate
  # permanently red for a reason outside this job's purview. Root's
  # tests/z_compliance/* suite (SQLLogicTest, PostgreSQL regression,
  # sqltest_conformance) is *already* intentionally excluded from fast per-PR
  # CI — see the ci-extended.yml note at the bottom of this file — so this job
  # explicitly selects `-p vibesql` and enumerates every OTHER root-package
  # `[[test]]` target (derived at run time from Cargo.toml, via its `name`/
  # `path` pairs, so newly-added tests are picked up automatically without
  # editing this file) rather than fighting that existing split.
  #
  # SKIP_TESTS below additionally excludes four targets — benchmark_example,
  # dialect_tests, select5_verification, metrics — that do NOT live under
  # tests/z_compliance/ but transitively `#[path = "../sqllogictest/mod.rs"]`-
  # include the same broken db_adapter/executor.rs match statement, so they
  # hit the identical #6412 compile error. Verified empirically (2026-08-22,
  # `cargo check -p vibesql --keep-going` over the full non-z_compliance
  # target list): exactly these four fail, all with the same E0004. Once
  # #6412 lands, drop these four names from SKIP_TESTS to restore their
  # coverage too.
  #
  # SKIP_TESTS also excludes six targets with genuine pre-existing test
  # *failures* (not compile errors), discovered by actually running the full
  # ~83-target set with `--no-fail-fast` (2026-08-22, since none of these
  # have ever run in CI before, there was no prior signal): alter_table (a
  # DROP COLUMN IF EXISTS bug, one test's own comment reads "known bug"),
  # delimited_identifiers, error_handling, sqlite_roundtrip, web_demo_basic
  # (a data-generation/escaping bug — see #6497), and update_pk_performance
  # (a wall-clock performance-threshold assertion, unsuitable for a shared CI
  # runner's variable load regardless of correctness). Landing this job with
  # any of these included would turn it red on the very first run for
  # reasons this CI-wiring PR did not introduce. Tracked for a follow-up fix
  # + re-inclusion in #6497.
  # ============================================================================
  test-root-package:
    runs-on: ubuntu-latest
    # Provisional — this job (and its ~77 previously-never-run integration
    # test targets) has no measured CI runtime history yet. Revisit once
    # several real runs establish an actual range; the sibling jobs above
    # started at the same 25-minute provisional budget (see their History
    # comment) before being tuned against real data.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: ./.github/actions/free-disk-space

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Run root vibesql package's integration tests (excludes tests/z_compliance/*, #6412-affected targets, and #6497 pre-existing failures)
        run: |
          SKIP_TESTS='^(sqllogictest_basic|sqllogictest_benchmark|sqllogictest_runner|sqllogictest_sqlite|sqllogictest_suite|sqltest_conformance|pgsql_regress|benchmark_example|dialect_tests|select5_verification|metrics|alter_table|delimited_identifiers|error_handling|sqlite_roundtrip|web_demo_basic|update_pk_performance)$'
          TESTS=$(awk '
            /^\[\[test\]\]$/ { name=""; path="" }
            /^name = "/ { name=$0; sub(/^name = "/,"",name); sub(/"$/,"",name) }
            /^path = "/ { path=$0; sub(/^path = "/,"",path); sub(/"$/,"",path)
              if (path !~ /^tests\/z_compliance\//) print name
            }
          ' Cargo.toml)
          ARGS=()
          while IFS= read -r t; do
            if [ -n "$t" ] && ! [[ "$t" =~ $SKIP_TESTS ]]; then
              ARGS+=(--test "$t")
            fi
          done <<< "$TESTS"
          echo "Running ${#ARGS[@]} root-package integration test targets"
          cargo test -p vibesql --release "${ARGS[@]}" -- --skip run_sqllogictest_suite

  # ============================================================================
  # WASM build check - catches wasm32-only breakage (e.g., getrandom backend
  # feature regressions from dependency bumps) that native builds never see.
  # See issue #5253 for the regression that motivated this job.
  # ============================================================================
  wasm-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          targets: wasm32-unknown-unknown
          cache-key-suffix: wasm

      - name: Check wasm32 build
        run: cargo check -p vibesql-wasm-bindings --lib --target wasm32-unknown-unknown

  # ============================================================================
  # Storage feature-matrix check - catches breakage in opendal-gated blob code
  # that the default feature set never compiles (e.g., the opendal 0.58 bump
  # removed Operator::finish). Cheap `cargo check` only, no build/test.
  # See issue #6081 for the regression that motivated this job.
  # ============================================================================
  storage-features-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: storage-features

      - name: Check opendal-gated storage backends
        run: cargo check -p vibesql-storage --features storage-all

  # ============================================================================
  # Extended validation tests (TPC-DS, SQLLogicTest, PostgreSQL, TCL) have been
  # moved to ci-extended.yml for manual dispatch. Run before merging significant
  # PRs with: gh workflow run ci-extended.yml
  # ============================================================================
