# i18n Validation Workflow
# Validates Fluent translation files for syntax and completeness

name: i18n Validation

on:
  push:
    branches: [main]
    paths:
      - 'crates/vibesql-l10n/**'
      - 'scripts/check-translations.py'
      - '.github/workflows/i18n-check.yml'
  pull_request:
    paths:
      - 'crates/vibesql-l10n/**'
      - 'scripts/check-translations.py'
      - '.github/workflows/i18n-check.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  # These two jobs run in parallel for faster feedback
  fluent-syntax:
    name: Fluent Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: i18n

      - name: Check Fluent syntax
        run: cargo run -p vibesql-l10n --bin check-ftl

  translation-completeness:
    name: Translation Completeness
    runs-on: ubuntu-latest
    # Runs in parallel with fluent-syntax (no needs: dependency)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python with uv
        run: uv python install 3.11

      - name: Check translation completeness
        run: uv run --python 3.11 scripts/check-translations.py --verbose

      - name: Generate coverage badge
        run: |
          mkdir -p badges
          uv run --python 3.11 scripts/check-translations.py --badge badges/i18n-coverage.json

      - name: Upload badge artifact
        uses: actions/upload-artifact@v4
        with:
          name: i18n-badge
          path: badges/i18n-coverage.json

  # Strict check - only fails on syntax errors, warns on incomplete translations
  # Waits for both parallel jobs to complete before running
  strict-check:
    name: Strict Validation
    runs-on: ubuntu-latest
    needs: [fluent-syntax, translation-completeness]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python with uv
        run: uv python install 3.11

      - name: Validate all locales
        run: |
          # Check for variable mismatches (strict)
          uv run --python 3.11 scripts/check-translations.py --ci --threshold 0

      - name: Report status
        run: |
          echo "i18n validation passed!"
          echo ""
          echo "Note: Translation completeness is tracked but not enforced."
          echo "Run 'python scripts/check-translations.py' locally to see coverage."
