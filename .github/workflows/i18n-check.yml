# i18n Validation Workflow
# Validates Fluent translation files for syntax and completeness
# Only runs on PRs (not on push to main) - changes validated in PR don't need re-validation

name: i18n Validation

on:
  pull_request:
    paths:
      - 'crates/vibesql-l10n/**'
      - 'web-demo/src/i18n/resources/**'
      - 'scripts/check-translations.py'
      - 'scripts/check-web-translations.py'
      - '.github/workflows/i18n-check.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  # These jobs run in parallel for faster feedback
  fluent-syntax:
    name: CLI Fluent Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: i18n

      - name: Check Fluent syntax
        run: cargo run -p vibesql-l10n --bin check-ftl

  cli-translation-completeness:
    name: CLI Translation Completeness
    runs-on: ubuntu-latest
    # Runs in parallel with fluent-syntax (no needs: dependency)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python with uv
        run: uv python install 3.11

      - name: Check CLI translation completeness
        run: uv run --no-project --python 3.11 scripts/check-translations.py --verbose

      - name: Generate CLI coverage badge
        run: |
          mkdir -p badges
          uv run --no-project --python 3.11 scripts/check-translations.py --badge badges/i18n-coverage.json

      - name: Upload CLI badge artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-i18n-badge
          path: badges/i18n-coverage.json

  web-translation-completeness:
    name: Web Demo Translation Completeness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python with uv
        run: uv python install 3.11

      - name: Check Web Demo translation completeness
        run: uv run --no-project --python 3.11 scripts/check-web-translations.py --verbose

      - name: Generate Web Demo coverage badge
        run: |
          mkdir -p badges
          uv run --no-project --python 3.11 scripts/check-web-translations.py --badge badges/web-i18n-coverage.json

      - name: Upload Web Demo badge artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-i18n-badge
          path: badges/web-i18n-coverage.json

  # Strict check - only fails on syntax errors, warns on incomplete translations
  # Waits for all parallel jobs to complete before running
  strict-check:
    name: Strict Validation
    runs-on: ubuntu-latest
    needs: [fluent-syntax, cli-translation-completeness, web-translation-completeness]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Setup Python with uv
        run: uv python install 3.11

      - name: Validate CLI locales
        run: |
          # Check for variable mismatches (strict)
          uv run --no-project --python 3.11 scripts/check-translations.py --ci --threshold 0

      - name: Validate Web Demo locales
        run: |
          # Check for variable mismatches (strict) - currently warn-only for web demo
          # TODO: Enable strict mode once variable mismatches are fixed
          uv run --no-project --python 3.11 scripts/check-web-translations.py --threshold 0 || true

      - name: Report status
        run: |
          echo "i18n validation passed!"
          echo ""
          echo "Note: Translation completeness is tracked but not enforced."
          echo "Run these commands locally to see coverage:"
          echo "  python scripts/check-translations.py      # CLI translations"
          echo "  python scripts/check-web-translations.py  # Web Demo translations"
