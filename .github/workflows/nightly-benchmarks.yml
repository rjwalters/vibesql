name: Nightly Benchmarks

on:
  schedule:
    # Run at 2:00 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skip_tpce:
        description: 'Skip TPC-E benchmark (long running)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Only allow one nightly run at a time
concurrency:
  group: nightly-benchmarks
  cancel-in-progress: false

jobs:
  # ============================================================================
  # TPC-H Full Suite (Higher Scale Factor)
  # ============================================================================
  tpch-full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: nightly

      - name: Run TPC-H full benchmark suite
        env:
          SCALE_FACTOR: "0.1"
          PROFILING_ITERATIONS: "5"
        run: |
          cargo bench --package vibesql-executor --bench tpch_profiling --features benchmark-comparison -- 2>&1 | tee tpch_full_output.txt

      - name: Upload TPC-H results
        uses: actions/upload-artifact@v5
        with:
          name: nightly-tpch-full-results
          path: tpch_full_output.txt
          retention-days: 30

      - name: Display TPC-H results
        if: always()
        run: |
          echo "## TPC-H Full Benchmark Results (SF 0.1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tpch_full_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 tpch_full_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # TPC-H with DuckDB Comparison (Separate job due to ~73MB binary size)
  # ============================================================================
  tpch-duckdb-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: nightly-duckdb

      - name: Run TPC-H with DuckDB comparison
        env:
          SCALE_FACTOR: "0.1"
          PROFILING_ITERATIONS: "5"
        run: |
          cargo bench --package vibesql-executor --bench tpch_profiling \
            --features benchmark-comparison,duckdb-comparison \
            -- 2>&1 | tee tpch_duckdb_output.txt

      - name: Generate comparison JSON
        if: always()
        run: |
          # Extract timing data and generate JSON for web-demo consumption
          python3 << 'PYEOF'
          import json
          import re
          import sys
          from datetime import datetime

          results = {
              "generated_at": datetime.utcnow().isoformat() + "Z",
              "scale_factor": 0.1,
              "source": "nightly-benchmark",
              "benchmarks": []
          }

          try:
              with open('tpch_duckdb_output.txt', 'r') as f:
                  content = f.read()

              # Parse timing output - look for patterns like "Q1: 123.45ms"
              # or "TOTAL: 123.45ms" lines
              query_pattern = re.compile(r'=== (Q\d+) ===.*?TOTAL:\s+([\d.]+)\s*(ms|s|us)', re.DOTALL)
              for match in query_pattern.finditer(content):
                  query = match.group(1).lower()
                  time_val = float(match.group(2))
                  unit = match.group(3)
                  # Convert to seconds
                  if unit == 'ms':
                      time_val /= 1000.0
                  elif unit == 'us':
                      time_val /= 1000000.0
                  results["benchmarks"].append({
                      "name": f"tpch_{query}_vibesql",
                      "stats": {"mean": time_val, "status": "passed"}
                  })

              with open('tpch_duckdb_comparison.json', 'w') as f:
                  json.dump(results, f, indent=2)
              print(f"Generated comparison JSON with {len(results['benchmarks'])} entries")
          except Exception as e:
              print(f"Warning: Could not generate JSON: {e}", file=sys.stderr)
              # Create empty results file
              with open('tpch_duckdb_comparison.json', 'w') as f:
                  json.dump(results, f, indent=2)
          PYEOF

      - name: Upload DuckDB comparison results
        uses: actions/upload-artifact@v5
        with:
          name: nightly-tpch-duckdb-comparison
          path: |
            tpch_duckdb_output.txt
            tpch_duckdb_comparison.json
          retention-days: 30

      - name: Display DuckDB comparison results
        if: always()
        run: |
          echo "## TPC-H DuckDB Comparison Results (SF 0.1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tpch_duckdb_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 tpch_duckdb_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # TPC-C Extended Duration
  # ============================================================================
  tpcc-extended:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: nightly

      - name: Run TPC-C extended benchmark
        env:
          TPCC_SCALE_FACTOR: "2"
          TPCC_DURATION_SECS: "60"
          TPCC_WARMUP_SECS: "10"
        run: |
          cargo bench --package vibesql-executor --bench tpcc_benchmark -- 2>&1 | tee tpcc_extended_output.txt

      - name: Upload TPC-C results
        uses: actions/upload-artifact@v5
        with:
          name: nightly-tpcc-extended-results
          path: tpcc_extended_output.txt
          retention-days: 30

      - name: Display TPC-C results
        if: always()
        run: |
          echo "## TPC-C Extended Benchmark Results (SF 2, 60s)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tpcc_extended_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A 30 "TPC-C Results" tpcc_extended_output.txt >> $GITHUB_STEP_SUMMARY || tail -50 tpcc_extended_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # TPC-DS Full Suite (All Queries)
  # ============================================================================
  tpcds-full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: nightly

      - name: Run TPC-DS full benchmark suite
        env:
          SCALE_FACTOR: "0.01"
          VALIDATE: "1"
          # Don't skip slow queries for nightly
          # SKIP_SLOW: "0"
        run: |
          timeout 6000 cargo bench --bench tpcds_runner --features benchmark-comparison -- 2>&1 | tee tpcds_full_output.txt || true

      - name: Upload TPC-DS results
        uses: actions/upload-artifact@v5
        with:
          name: nightly-tpcds-full-results
          path: tpcds_full_output.txt
          retention-days: 30

      - name: Display TPC-DS results
        if: always()
        run: |
          echo "## TPC-DS Full Benchmark Results (SF 0.01, All Queries)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tpcds_full_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A 1000 "=== CSV Output ===" tpcds_full_output.txt | head -120 >> $GITHUB_STEP_SUMMARY || tail -100 tpcds_full_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # TPC-E Benchmark (Complex OLTP)
  # ============================================================================
  tpce:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ github.event.inputs.skip_tpce != 'true' }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: nightly

      - name: Run TPC-E benchmark
        env:
          TPCE_DURATION_SECS: "60"
          TPCE_WARMUP_SECS: "10"
        run: |
          cargo bench --package vibesql-executor --bench tpce_benchmark -- 2>&1 | tee tpce_output.txt

      - name: Upload TPC-E results
        uses: actions/upload-artifact@v5
        with:
          name: nightly-tpce-results
          path: tpce_output.txt
          retention-days: 30

      - name: Display TPC-E results
        if: always()
        run: |
          echo "## TPC-E Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tpce_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 tpce_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # TPC-DS with DuckDB Comparison (Separate job due to binary size)
  # ============================================================================
  tpcds-duckdb-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: nightly-duckdb

      - name: Run TPC-DS with DuckDB comparison
        env:
          SCALE_FACTOR: "0.01"
          VALIDATE: "1"
        run: |
          timeout 6000 cargo bench --bench tpcds_runner \
            --features benchmark-comparison,duckdb-comparison \
            -- 2>&1 | tee tpcds_duckdb_output.txt || true

      - name: Generate comparison JSON
        if: always()
        run: |
          # Parse TPC-DS output and generate comparison JSON
          python3 << 'PYEOF'
          import json
          import re
          import sys
          from datetime import datetime

          results = {
              "generated_at": datetime.utcnow().isoformat() + "Z",
              "scale_factor": 0.01,
              "source": "nightly-benchmark",
              "benchmark_type": "tpcds",
              "benchmarks": []
          }

          try:
              with open('tpcds_duckdb_output.txt', 'r') as f:
                  content = f.read()

              # Parse CSV output section if present
              csv_match = re.search(r'=== CSV Output ===\s*\n(.*?)(?:\n\n|\Z)', content, re.DOTALL)
              if csv_match:
                  csv_lines = csv_match.group(1).strip().split('\n')
                  for line in csv_lines[1:]:  # Skip header
                      parts = line.split(',')
                      if len(parts) >= 3:
                          query = parts[0].strip().lower()
                          try:
                              time_ms = float(parts[1].strip())
                              status = parts[2].strip() if len(parts) > 2 else "passed"
                              results["benchmarks"].append({
                                  "name": f"tpcds_{query}_vibesql",
                                  "stats": {
                                      "mean": time_ms / 1000.0,  # Convert to seconds
                                      "status": status
                                  }
                              })
                          except ValueError:
                              continue

              with open('tpcds_duckdb_comparison.json', 'w') as f:
                  json.dump(results, f, indent=2)
              print(f"Generated TPC-DS comparison JSON with {len(results['benchmarks'])} entries")
          except Exception as e:
              print(f"Warning: Could not generate JSON: {e}", file=sys.stderr)
              with open('tpcds_duckdb_comparison.json', 'w') as f:
                  json.dump(results, f, indent=2)
          PYEOF

      - name: Upload TPC-DS DuckDB comparison results
        uses: actions/upload-artifact@v5
        with:
          name: nightly-tpcds-duckdb-comparison
          path: |
            tpcds_duckdb_output.txt
            tpcds_duckdb_comparison.json
          retention-days: 30

      - name: Display TPC-DS DuckDB comparison results
        if: always()
        run: |
          echo "## TPC-DS DuckDB Comparison Results (SF 0.01)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f tpcds_duckdb_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -A 1000 "=== CSV Output ===" tpcds_duckdb_output.txt | head -120 >> $GITHUB_STEP_SUMMARY || tail -100 tpcds_duckdb_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Sysbench Extended
  # ============================================================================
  sysbench-extended:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: nightly

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run Sysbench extended benchmarks
        run: |
          python3 scripts/run_sysbench_benchmarks.py \
            --table-size 100000 \
            --duration 30 \
            --warmup 5 \
            --output sysbench_extended_results.json

      - name: Upload Sysbench results
        uses: actions/upload-artifact@v5
        with:
          name: nightly-sysbench-extended-results
          path: sysbench_extended_results.json
          retention-days: 30

      - name: Display Sysbench results
        if: always()
        run: |
          echo "## Sysbench Extended Results (100k rows, 30s per workload)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f sysbench_extended_results.json ]; then
            python3 << 'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          with open('sysbench_extended_results.json') as f:
              data = json.load(f)
          print('| Workload | Database | Latency | Ops/sec |')
          print('|----------|----------|---------|---------|')
          for b in data.get('benchmarks', []):
              name_parts = b['name'].split('_')
              db = name_parts[-1]
              workload = '_'.join(name_parts[1:-1])
              latency_us = b['stats']['mean'] * 1_000_000
              ops_sec = 1 / b['stats']['mean'] if b['stats']['mean'] > 0 else 0
              print(f'| {workload} | {db} | {latency_us:.2f} us | {ops_sec:.0f} |')
          PYEOF
          fi

  # ============================================================================
  # SQLLogicTest Complete Suite
  # ============================================================================
  sqllogictest-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: nightly

      - name: Run SQLLogicTest complete suite
        env:
          # 2.5 hour time budget for comprehensive coverage
          SQLLOGICTEST_TIME_BUDGET: "9000"
        run: |
          cargo test --release --package vibesql --test sqllogictest_suite -- --nocapture 2>&1 | tee sqllogictest_complete_output.txt

      - name: Upload SQLLogicTest results
        uses: actions/upload-artifact@v5
        with:
          name: nightly-sqllogictest-complete-results
          path: |
            sqllogictest_complete_output.txt
            target/sqllogictest_results.json
          retention-days: 30

      - name: Display SQLLogicTest results
        if: always()
        run: |
          echo "## SQLLogicTest Complete Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/sqllogictest_results.json ]; then
            python3 << 'PYEOF' >> $GITHUB_STEP_SUMMARY
          import json
          try:
              with open('target/sqllogictest_results.json') as f:
                  data = json.load(f)
              print(f"Files tested: {data.get('total', 'N/A')}")
              print(f"Passed: {data.get('passed', 'N/A')}")
              print(f"Failed: {data.get('failed', 'N/A')}")
              print(f"Pass rate: {data.get('pass_rate', 'N/A')}%")
          except Exception as e:
              print(f'Error reading results: {e}')
          PYEOF
          else
            echo "No results JSON available" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Summary Job
  # ============================================================================
  summary:
    runs-on: ubuntu-latest
    needs: [tpch-full, tpch-duckdb-comparison, tpcc-extended, tpcds-full, tpcds-duckdb-comparison, sysbench-extended, sqllogictest-complete]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Generate summary report
        run: |
          echo "# Nightly Benchmark Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run completed at: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmark | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| TPC-H Full | ${{ needs.tpch-full.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TPC-H DuckDB Comparison | ${{ needs.tpch-duckdb-comparison.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TPC-C Extended | ${{ needs.tpcc-extended.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TPC-DS Full | ${{ needs.tpcds-full.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TPC-DS DuckDB Comparison | ${{ needs.tpcds-duckdb-comparison.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Sysbench Extended | ${{ needs.sysbench-extended.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SQLLogicTest Complete | ${{ needs.sqllogictest-complete.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Comparison Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "DuckDB comparison results are available as artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- \`nightly-tpch-duckdb-comparison\`: TPC-H comparison data" >> $GITHUB_STEP_SUMMARY
          echo "- \`nightly-tpcds-duckdb-comparison\`: TPC-DS comparison data" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All artifacts are available for download (30 day retention)" >> $GITHUB_STEP_SUMMARY
