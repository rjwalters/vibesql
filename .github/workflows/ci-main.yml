name: CI (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Simpler concurrency: just prevent multiple CI runs on main
concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Build and Test
  # ============================================================================
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free disk space
        run: |
          # Remove large pre-installed software to free disk space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key-suffix: ci

      - name: Run unit tests
        run: cargo test --release -- --skip run_sqllogictest_suite

      - name: Run sqltest conformance suite
        run: cargo test -p vibesql --test sqltest_conformance --release -- --nocapture
        continue-on-error: true

  # ============================================================================
  # Web Demo is deployed manually via: cd web-demo && wrangler deploy
  # See CLAUDE.md for instructions.
  # ============================================================================
