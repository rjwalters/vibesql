name: 'Setup Rust with Caching'
description: 'Standardized Rust setup with Swatinem rust-cache'
inputs:
  toolchain:
    description: 'Rust toolchain version'
    required: false
    default: 'stable'
  targets:
    description: 'Additional targets to install (e.g., wasm32-unknown-unknown)'
    required: false
    default: ''
  cache-key-suffix:
    description: 'Suffix for cache key (e.g., "ci", "wasm", "boost")'
    required: false
    default: 'default'

runs:
  using: 'composite'
  steps:
    - name: Setup sccache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Enable sccache GHA cache
      shell: bash
      run: |
        echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
        echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
        # Test if sccache can start - if not, disable it to prevent build failures
        if ! timeout 10 sccache --start-server 2>/dev/null; then
          echo "::warning::sccache failed to start, falling back to normal compilation"
          echo "RUSTC_WRAPPER=" >> $GITHUB_ENV
        fi

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        # x86-64-v2 suffix busts cache after target-cpu change (see .cargo/config.toml)
        shared-key: rust-${{ inputs.cache-key-suffix }}-x86-64-v2
        # Automatically handles:
        # - ~/.cargo/bin/
        # - ~/.cargo/registry/index/
        # - ~/.cargo/registry/cache/
        # - ~/.cargo/git/db/
        # - target/
