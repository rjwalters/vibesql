name: 'Free Disk Space'
description: 'Maximum cleanup of system packages and docker artifacts to free disk space for large builds'

runs:
  using: 'composite'
  steps:
    - name: Free disk space
      shell: bash
      run: |
        # Maximum cleanup to free disk space for large Rust builds
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /opt/hostedtoolcache/go
        sudo rm -rf /opt/hostedtoolcache/Ruby
        sudo rm -rf /opt/hostedtoolcache/node
        sudo rm -rf /opt/microsoft
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/share/swift
        sudo rm -rf /opt/hostedtoolcache/Java_Temurin_jdk
        sudo rm -rf /opt/hostedtoolcache/PyPy
        sudo rm -rf /opt/hostedtoolcache/Python
        sudo rm -rf /var/log/*
        sudo rm -rf /var/cache/apt/archives/*
        sudo docker image prune --all --force
        sudo docker system prune --all --force --volumes
        sudo docker volume prune --all --force
        df -h
