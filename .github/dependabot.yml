version: 2
# Policy (rjwalters/.github repo-policy.json, provider: dependabot):
# - cooldown: version updates wait 14 days after release; security updates are
#   not delayed by cooldown and ignore the schedule.
# - package ecosystems group minor + patch only; majors arrive as their own,
#   individually reviewable PRs.
updates:
  # Cargo dependency updates (daily scan, minor + patch grouped)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "loom:review-requested"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Cargo dependency updates for the fuzz workspace (separate cargo workspace,
  # cannot inherit [workspace.dependencies] from the root)
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "loom:review-requested"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # npm/pnpm dependency updates for the root workspace lockfile
  # (root package.json is scripts-only, but pnpm-lock.yaml resolves the
  # packages/* workspace deps — most open security alerts live here)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 removes moduleResolution=node10 and changes compiler APIs
      # that tsup 8.x's bundled rollup-plugin-dts depends on; the packages/*
      # builds break under it. Drop this once tsup supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "loom:review-requested"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # npm/pnpm dependency updates for web-demo
  - package-ecosystem: "npm"
    directory: "/web-demo"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is unsupported by typescript-eslint (crashes `pnpm lint`
      # outright, not just a lint-finding regression); pinned to the 6.x line
      # in package.json until typescript-eslint/typescript-eslint#10940 lands
      # upstream. Drop this once typescript-eslint supports TS 7.1+. See #6689.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "loom:review-requested"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Python dependency updates for root project
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "loom:review-requested"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Python dependency updates for benchmarks
  - package-ecosystem: "pip"
    directory: "/benchmarks"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - "*"
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"
      - "loom:review-requested"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions updates (all update types grouped, majors included)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
        update-types: ["major", "minor", "patch"]
    labels:
      - "dependencies"
      - "loom:review-requested"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
