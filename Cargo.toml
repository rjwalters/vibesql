[package]
name = "vibesql"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SQL database engine with SQL:1999 compliance"
keywords = ["sql", "database", "query", "engine"]
categories = ["database"]
include = [
    "/src/**/*",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]

[features]
memory-tracking = ["memory-stats"]
# MVCC machinery toggle (Phase 1 of #5136). Off by default. See
# `crates/vibesql-storage/Cargo.toml` for full documentation. Enabling this
# at the top level forwards the flag to `vibesql-storage`.
mvcc_enabled = ["vibesql-storage/mvcc_enabled"]

[dependencies]
vibesql-types = { version = "0.1.4", path = "crates/vibesql-types" }
vibesql-ast = { version = "0.1.4", path = "crates/vibesql-ast" }
vibesql-catalog = { version = "0.1.4", path = "crates/vibesql-catalog" }
vibesql-storage = { version = "0.1.4", path = "crates/vibesql-storage" }
vibesql-executor = { version = "0.1.4", path = "crates/vibesql-executor" }
vibesql-parser = { version = "0.1.4", path = "crates/vibesql-parser" }
memory-stats = { version = "1.0", optional = true }

[dev-dependencies]
regex = "1.10"
sqllogictest = "0.28"
tempfile = "3.19"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
glob = "0.3"
md-5 = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
vibesql-cli = { version = "0.1.4", path = "crates/vibesql-cli" }
chrono = "0.4"

[workspace]
members = [
    "crates/vibesql-parser",
    "crates/vibesql-types",
    "crates/vibesql-ast",
    "crates/vibesql-catalog",
    "crates/vibesql-storage",
    "crates/vibesql-executor",
    "crates/vibesql-cli",
    "crates/vibesql-server",
    "crates/vibesql-wasm-bindings",
    "crates/vibesql-python-bindings",
    "crates/vibesql-sqllogictest",
    "crates/vibesql-l10n",
    "crates/vibesql-bench-common",
]
# Exclude Python bindings from default build (requires Python development environment)
default-members = [
    "crates/vibesql-parser",
    "crates/vibesql-types",
    "crates/vibesql-ast",
    "crates/vibesql-catalog",
    "crates/vibesql-storage",
    "crates/vibesql-executor",
    "crates/vibesql-cli",
    "crates/vibesql-server",
    "crates/vibesql-wasm-bindings",
    "crates/vibesql-sqllogictest",
    "crates/vibesql-l10n",
]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2021"
authors = ["vibesql contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rjwalters/vibesql"

[workspace.dependencies]
# Will add dependencies as needed for each phase
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py39"] }

