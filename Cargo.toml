# Release profile optimized for CI
[profile.release]
debug = false             # Disable debug symbols to reduce binary size in CI

# Custom release profile optimized for WASM size
[profile.wasm-release]
inherits = "release"
opt-level = "z"           # Optimize for size
lto = "fat"               # Link-Time Optimization
codegen-units = 1         # Better optimization (slower compile, smaller binary)
strip = true              # Remove debug symbols
panic = "abort"           # Smaller panic handler

# Profiling profile - release optimizations with maximum debug info
[profile.profiling]
inherits = "release"
debug = 2                 # Full debug info for detailed profiling
strip = false             # Keep all symbols

# Bench profile - enable debug symbols for flamegraph profiling
# This adds ~10% to binary size but enables meaningful stack traces
[profile.bench]
debug = 1                 # Line tables only (smaller than debug=2)

[patch.crates-io]
sqllogictest = { path = "crates/vibesql-sqllogictest" }
