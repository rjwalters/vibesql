[package]
name = "vibesql-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for vibesql SQL database"
keywords = ["sql", "database", "cli"]
categories = ["database", "command-line-utilities"]

[[bin]]
name = "vibesql"
path = "src/main.rs"
doc = false  # Binaries don't need documentation

[dependencies]
# Core VibeSQL crates
vibesql-types = { version = "0.2.0", path = "../vibesql-types" }
vibesql-ast = { version = "0.2.0", path = "../vibesql-ast" }
vibesql-catalog = { version = "0.2.0", path = "../vibesql-catalog" }
vibesql-storage = { version = "0.2.0", path = "../vibesql-storage" }
vibesql-executor = { version = "0.2.0", path = "../vibesql-executor" }
vibesql-parser = { version = "0.2.0", path = "../vibesql-parser" }
vibesql-l10n = { version = "0.2.0", path = "../vibesql-l10n" }

# CLI dependencies
clap = { version = "4", features = ["derive"] }
rustyline = "18"
prettytable-rs = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
atty = "0.2"
toml = "1.1"
dirs = "6.0"
regex = "1.10"
rusqlite = { workspace = true }
log = "0.4"

[dev-dependencies]
tempfile = "3"
