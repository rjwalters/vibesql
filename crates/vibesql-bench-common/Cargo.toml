[package]
name = "vibesql-bench-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared benchmark infrastructure for vibesql benchmarks"
keywords = ["sql", "database", "benchmark", "tpch", "tpcc"]
categories = ["database"]

[features]
default = []
# VibeSQL schema loading support
vibesql = [
    "dep:vibesql-types",
    "dep:vibesql-ast",
    "dep:vibesql-catalog",
    "dep:vibesql-storage",
    "dep:arcstr",
]
# Comparison engine schema loading
sqlite = ["dep:rusqlite"]
duckdb = ["dep:duckdb"]
mysql = ["dep:mysql"]

[dependencies]
# Random number generation for Sysbench data
rand = "0.10"
rand_chacha = "0.10"

# VibeSQL dependencies (optional, for schema loading)
vibesql-types = { version = "0.2.0", path = "../vibesql-types", optional = true }
vibesql-ast = { version = "0.2.0", path = "../vibesql-ast", optional = true }
vibesql-catalog = { version = "0.2.0", path = "../vibesql-catalog", optional = true }
vibesql-storage = { version = "0.2.0", path = "../vibesql-storage", optional = true }
arcstr = { version = "1.2", optional = true }

# Comparison engine dependencies (optional)
rusqlite = { workspace = true, optional = true }
duckdb = { version = "1.1", features = ["bundled"], optional = true }
mysql = { version = "28.0", optional = true }
