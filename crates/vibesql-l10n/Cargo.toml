[package]
name = "vibesql-l10n"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Localization support for VibeSQL using Project Fluent"
keywords = ["sql", "database", "localization", "i18n", "l10n"]
categories = ["database", "internationalization"]

[[bin]]
name = "check-ftl"
path = "src/bin/check-ftl.rs"

[[bin]]
name = "check-translations"
path = "src/bin/check-translations.rs"

[dependencies]
fluent = "0.17"
fluent-syntax = "0.12"
unic-langid = "0.9"
rust-embed = { version = "8", features = ["debug-embed"] }
once_cell = "1.19"
thiserror = "2.0"

[dev-dependencies]
