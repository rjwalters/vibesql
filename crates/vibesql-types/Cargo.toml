[package]
name = "vibesql-types"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Type system for vibesql SQL database engine"
keywords = ["sql", "database", "types"]
categories = ["database"]

[features]
default = []
# Use arcstr crate for small string optimization (SSO)
# Strings ≤22 bytes are stored inline without heap allocation
arcstr = ["dep:arcstr"]

[dependencies]
arcstr = { version = "1.2", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "types_bench"
harness = false
