[package]
name = "vibesql-consensus"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Consensus adapter layer for VibeSQL WAN replication (see ADR-0004)"
keywords = ["sql", "database", "consensus", "raft", "replication"]
categories = ["database"]

# NOTE (ADR-0004): `openraft` is a dependency of THIS crate only. Consumer
# crates depend on the engine-agnostic `ConsensusBackend` trait and must
# never see openraft types, so the consensus engine stays swappable.

[features]
# MVCC machinery toggle, forwarded to the storage/executor stack (see
# `crates/vibesql-storage/Cargo.toml` for full documentation). Off by
# default, matching the workspace. The replicated state machine works in
# both states; commit-timestamp stamping (`xmin` = Raft log index) and the
# vacuum-horizon interlock only have observable effects with this ON, so
# the tests asserting them are gated on it.
mvcc_enabled = ["vibesql-storage/mvcc_enabled", "vibesql-executor/mvcc_enabled"]

[dependencies]
# Raft Phase B1 (#5199): the replicated state machine applies committed
# log entries to a real database. Dependency direction is consensus →
# executor → storage (never the reverse), per ADR-0004's layering rule.
vibesql-ast = { version = "0.1.4", path = "../vibesql-ast" }
# `catalog` for TableSchema in the freeze pass (#5377): the propose-side
# evaluation context and the volatile-DEFAULT audit inspect column
# defaults.
vibesql-catalog = { version = "0.1.4", path = "../vibesql-catalog" }
vibesql-executor = { version = "0.1.4", path = "../vibesql-executor" }
vibesql-parser = { version = "0.1.4", path = "../vibesql-parser" }
vibesql-storage = { version = "0.1.4", path = "../vibesql-storage" }
vibesql-types = { version = "0.1.4", path = "../vibesql-types" }
# `storage-v2` unseals the RaftLogStorage/RaftStateMachine traits (the v2
# storage API) so this crate can implement them; `serde` because our log
# entry payloads and vote state will be serialized for durability in PR 2.
openraft = { version = "0.9.24", features = ["serde", "storage-v2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# `rt`/`net`/`io-util` power the TCP transport (Phase A3, PR 2): the
# per-node listener task and length-prefix framed connections. `time` bounds
# each outbound RPC by openraft's hard TTL. `sync` predates this (metrics
# watch channel, oneshots).
tokio = { version = "1.0", features = ["sync", "rt", "net", "io-util", "time"] }
# Static `cluster.toml` membership parsing (Phase A3, PR 2). Same version
# the server crate already uses for its config file.
toml = "1.1"

[dev-dependencies]
tempfile = "3.19"
# `macros` for #[tokio::test]; everything else the tests need (rt, net,
# io-util, time) is already enabled on the main dependency above.
tokio = { version = "1.0", features = ["rt", "macros", "time"] }
# Row-value assertions in the integration tests (tests/leader_reads.rs):
# `MvccRaftNode::query*` returns `Vec<Vec<SqlValue>>`, and integration
# test binaries only see dev-dependencies. Same crate the library itself
# depends on above.
vibesql-types = { version = "0.1.4", path = "../vibesql-types" }
