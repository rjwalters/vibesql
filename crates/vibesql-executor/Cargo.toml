[package]
name = "vibesql-executor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Query execution engine for vibesql SQL database"
keywords = ["sql", "database", "executor", "query"]
categories = ["database"]

[dependencies]
vibesql-types = { version = "0.2.0", path = "../vibesql-types" }
vibesql-ast = { version = "0.2.0", path = "../vibesql-ast" }
vibesql-catalog = { version = "0.2.0", path = "../vibesql-catalog" }
vibesql-storage = { version = "0.2.0", path = "../vibesql-storage" }
vibesql-parser = { version = "0.2.0", path = "../vibesql-parser" }
vibesql-l10n = { version = "0.2.0", path = "../vibesql-l10n" }
chrono = "0.4"
rayon = { version = "1.10", optional = true }
crossbeam-deque = { version = "0.8", optional = true }
indexmap = "2.0"
hex = "0.4"
instant = { version = "0.1", features = ["wasm-bindgen"] }
geo = { version = "0.33", optional = true }
rstar = { version = "0.13", optional = true }
lru = "0.18"
log = "0.4"
bumpalo = { version = "3.16", features = ["collections"] }
ahash = "0.8"
arcstr = "1.2"
# SIMD-accelerated substring / byte search for the columnar general LIKE matcher
# (literal-run search between wildcards). Already resolved transitively at 2.8.x;
# promoted to a direct dependency here (issue #6011).
memchr = "2.8"
# The SQLite JSON1 functions (json_object/json_set/json_patch/...) need three
# serde_json behaviors to match sqlite3 byte-for-byte:
#   * preserve_order    - keep object keys in insertion order
#   * arbitrary_precision - preserve the exact source number tokens (e.g.
#                           `34.5e+6`) through parse+serialize, so mutation
#                           functions round-trip untouched numbers verbatim.
#   * unbounded_depth   - lets `Deserializer::disable_recursion_limit()` lift
#                           serde_json's hard-coded 128-level recursion cap. We
#                           only reach that call AFTER an iterative depth precheck
#                           has already bounded nesting to <= SQLITE_MAX_JSON_DEPTH
#                           (1000), so serde never recurses on unbounded untrusted
#                           input (issue #6052). Without this feature json_valid /
#                           json() reject canonical documents deeper than ~127.
# `serde` provides the `Deserialize` trait used to drive a manually-constructed
# `serde_json::Deserializer` with `disable_recursion_limit()` (issue #6052).
serde = "1.0"
serde_json = { version = "1.0", features = [
    "preserve_order",
    "arbitrary_precision",
    "unbounded_depth",
] }
# serde_json's `Value` deserializer recurses once per nesting level on the native
# call stack; even at SQLITE_MAX_JSON_DEPTH (1000) that overflows an ordinary
# stack. serde_stacker moves that recursion onto a heap-backed growable stack so
# depth-bounded (<= 1000) but deep documents parse without overflow — the pairing
# serde_json's own docs recommend for `disable_recursion_limit()` (issue #6052).
serde_stacker = "0.1"
tokio = { version = "1.0", features = ["sync"] }
rand = "0.10"
md-5 = "0.11"

# Arrow dependencies for vectorized execution
# Using 53.0+ for chrono 0.4.42 compatibility (fixes quarter() method ambiguity)
arrow = "59.0"

# Optional comparison engine dependencies
rusqlite = { workspace = true, optional = true }
duckdb = { version = "1.1", features = ["bundled"], optional = true }
mysql = { version = "28.0", optional = true }

# jemalloc for better memory release characteristics in benchmarks
# These must be in [dependencies] (not dev-dependencies) to be feature-gated
tikv-jemallocator = { version = "0.7", optional = true }
tikv-jemalloc-ctl = { version = "0.7", features = ["stats"], optional = true }

# On-demand stack growth for native trigger recursion (#5534). Lets nested
# trigger firing reach SQLite's full SQLITE_MAX_TRIGGER_DEPTH (1000) without
# overflowing a fixed worker-thread stack. stacker has no wasm backend, so it is
# gated to non-wasm targets; wasm keeps the lower stack-safe native cap.
# NOTE: this target table must stay at the END of the dependency section — a TOML
# table header captures every key until the next header, so any plain
# [dependencies] entry placed below it would be accidentally gated to non-wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
stacker = "0.1.24"

[dev-dependencies]
vibesql-parser = { version = "0.2.0", path = "../vibesql-parser" }
# Note: vibesql-bench-common features (sqlite, duckdb, mysql) are enabled via Cargo feature unification
# when the corresponding features are enabled on vibesql-executor
vibesql-bench-common = { version = "0.2.0", path = "../vibesql-bench-common", features = ["vibesql"] }
# NOTE: vibesql-server dev-dependency removed to break circular dependency.
# Server benchmarks (sysbench_server, tpcc_server, tpch_server) are now in vibesql-server crate.
criterion = { version = "0.8", features = ["html_reports"] }
parking_lot = "0.12"  # For concurrent_throughput benchmark
rand = "0.10"
rand_chacha = "0.10"
env_logger = "0.11"
libc = "0.2"
sysinfo = "0.39"
tokio = { version = "1.0", features = ["full", "rt-multi-thread"] }
tempfile = "3.19"
num_cpus = "1.16"

[features]
default = ["parallel", "spatial", "native-columnar"]
# Parallel processing using rayon (disabled in WASM where it provides no benefit)
parallel = ["rayon", "crossbeam-deque"]
# Spatial/geospatial query support (optional, reduces binary size)
spatial = ["geo", "rstar"]
# MVCC machinery toggle (Phase 1 of #5136). Off by default.
# Phase 1c enables write-path xmin/xmax stamping in INSERT/UPDATE/DELETE
# when this flag is on; reads are still unfiltered until Phase 1d.
# See `crates/vibesql-storage/Cargo.toml` for full documentation.
mvcc_enabled = ["vibesql-storage/mvcc_enabled"]

# VibeSQL performance features (for benchmarks)
# Native columnar execution (Phase 2b - zero row materialization)
# Enabled by default. Set VIBESQL_DISABLE_COLUMNAR=1 to opt-out.
native-columnar = []
# Fast in-memory indexes for ephemeral benchmark data (avoids slow disk-backed index creation)
in-memory-indexes = ["vibesql-storage/in-memory-indexes"]

# Comparison engines (embedded)
# Note: DuckDB linking causes significant binary bloat (73MB vs 15MB) which
# affects CPU cache locality and can slow down benchmarks.
# Enable corresponding features in vibesql-bench-common for schema loading
sqlite = ["dep:rusqlite", "vibesql-bench-common/sqlite"]
duckdb = ["dep:duckdb", "vibesql-bench-common/duckdb"]

# Comparison engines (client-server)
# MySQL requires MYSQL_URL env var (e.g., mysql://root:password@localhost:3306/tpch)
mysql = ["dep:mysql"]
# vibesql-server is a separate crate, not a feature here

# Convenience groups
all-embedded = ["sqlite", "duckdb"]
all-servers = ["mysql"]
all-engines = ["all-embedded", "all-servers"]

# Recommended benchmark setup (VibeSQL optimized + all engines)
# Usage: cargo bench --features benchmark
benchmark = ["native-columnar", "in-memory-indexes", "all-engines"]

# Enable detailed profiling output for Q6 query
profile-q6 = []
# Enable detailed profiling output for TPC-C transactions
profile-tpcc = []
# Enable experimental SIMD-accelerated group-by aggregation (research/experimental)
simd = []
# Use jemalloc allocator for better memory release characteristics
# Usage: cargo bench --features jemalloc -- tpcds_runner
jemalloc = ["tikv-jemallocator", "tikv-jemalloc-ctl"]

